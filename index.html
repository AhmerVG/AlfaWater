<style>
/* Layout: the film on top (4:5), the name, tagline and coming soon under it; side by side on wide screens. */
:root{
  color-scheme: light;
  --page:#F1EEE7;     /* chuna, limewash */
  --ink:#22303A;
  --ink-soft:#56636C;
  --key:#7E2E57;      /* phalsa, for the 2 key words (temporary) */
  --line:#D6D0C3;
  --film-bg:#1C1A18;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--page);color:var(--ink);font-family:"Outfit",system-ui,sans-serif}
main{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(20px,4vw,64px);
  max-width:1280px;margin:0 auto;padding-block:clamp(20px,4vw,48px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.film{position:relative;width:min(100%, 560px, calc(54svh * .8));justify-self:center;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--film-bg);box-shadow:0 18px 50px rgba(34,48,58,.18)}
.film svg{display:block;width:100%;height:100%}
.replay{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,18,16,.55);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .6s}
.replay.on{opacity:1;visibility:visible}
.replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
.copy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(12px,2vw,22px)}
.name .alfa{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(38px,5vw,68px);line-height:1;color:var(--ink);letter-spacing:-.5px}
.name .tech{display:block;margin-top:8px;font-weight:600;font-size:clamp(11px,1vw,13px);letter-spacing:.42em;text-transform:uppercase;color:var(--ink-soft);padding-left:.42em}
.rule{width:56px;height:2px;background:var(--line);border-radius:2px}
.tag{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:clamp(96px,10vw,130px)}
.urdu{font-family:"Nastaliq",serif;font-weight:600;font-size:clamp(20px,2.6vw,38px);line-height:2.1;color:var(--ink);direction:rtl;white-space:nowrap}
.urdu .w{display:inline-block;transition:color .8s ease,transform .8s ease}
.urdu .w.key{color:var(--key)}
.english{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:clamp(17px,1.7vw,22px);line-height:1.45;color:var(--ink-soft);transition:opacity 1s ease,transform 1s ease}
.nb{display:inline-block}
.soon{display:inline-flex;align-items:center;gap:14px;padding:10px 22px 10px 18px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.5)}
.soon .dot{width:10px;height:10px;border-radius:50%;background:var(--key);position:relative}
.soon .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--key);opacity:0;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
.soon .ur,.soon .en{white-space:nowrap}
.soon .ur{font-family:"Nastaliq",serif;font-weight:600;font-size:20px;line-height:1.9;color:var(--ink);direction:rtl}
.soon .en{font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.soon .bar{width:1px;height:22px;background:var(--line)}
.js .tag:not(.on) .w{color:rgba(34,48,58,.10);transform:translateY(6px)}
.js .tag:not(.on) .english{opacity:0;transform:translateY(8px)}
.tag.on .w{color:var(--ink)}
.tag.on .w.key{color:var(--key)}
@media (max-width:900px){
  main{grid-template-columns:1fr;gap:12px;padding-block:12px 24px;min-height:auto}
  .copy{gap:10px}
  .name .alfa{font-size:34px}
  .tag{min-height:auto}
}
@media (max-width:380px){
  .soon{gap:10px;padding:8px 16px 8px 14px}
  .soon .ur{font-size:18px}
  .soon .en{font-size:12px;letter-spacing:.16em}
}
/* film internals */
.sc{visibility:hidden;opacity:0}
.sc.first{visibility:visible;opacity:1}
</style>

  // dry leaves for the season change
  (function(){
    var g = $('leaves'), cols = ['#B88A44', '#9C6B2F', '#C9A55A', '#8A5A2B'];
    for (var i = 0; i < 30; i++){
      var x, y, r = Math.random();
      if (r < .45){ x = rnd(80, 740); y = rnd(170, 400); }
      else if (r < .8){ x = rnd(80, 740); y = rnd(880, 990); }
      else { x = rnd(1, 0) < .5 ? rnd(60, 160) : rnd(640, 740); y = rnd(420, 880); }
      el('path', {d: 'M0 0 C12 -15 33 -15 45 0 C33 15 12 15 0 0 Z M0 0 L45 0', fill: cols[i % 4], stroke: '#6E4A20', 'stroke-width': 1.2, transform: 'translate(' + x + ' ' + y + ') rotate(' + rnd(0, 360) + ')'}, g);
    }
  })();

  // ---------- camera: frame any 4:5 rectangle of a scene ----------
  var cams = {};
  function camState(id){ if (!cams[id]) cams[id] = {x: 0, y: 0, w: 800}; return cams[id]; }
  function applyCam(id){ var s = camState(id), k = 800 / s.w; $(id).setAttribute('transform', 'translate(' + (-s.x * k) + ' ' + (-s.y * k) + ') scale(' + k + ')'); }
  function cam(tl, id, r, t, dur, ease){
    var s = camState(id);
    r = [Math.max(0, Math.min(r[0], 800 - r[2])), Math.max(0, Math.min(r[1], 1000 - r[2] * 1.25)), r[2]];
    tl.to(s, {x: r[0], y: r[1], w: r[2], duration: dur || .001, ease: ease || 'power1.inOut', onUpdate: function(){ applyCam(id); }}, t);
  }

  // ---------- always-on life: steam, ripples, flowing water, specks ----------
  var ambient = [];
  function always(){
    ambient.forEach(function(a){ a.kill(); }); ambient = [];
    gsap.utils.toArray('.stm').forEach(function(p, i){
      ambient.push(gsap.fromTo(p, {y: 0, opacity: .7}, {y: -60, opacity: 0, duration: 3 + i * .4, repeat: -1, ease: 'none', delay: i * .6}));
    });
    gsap.utils.toArray('.rip').forEach(function(r, i){
      ambient.push(gsap.fromTo(r, {attr: {rx: 10, ry: 3}, opacity: .9}, {attr: {rx: 60, ry: 14}, opacity: 0, duration: 1.4, repeat: -1, delay: i * .7, ease: 'power1.out'}));
    });
    ambient.push(gsap.to('#YstreamFlow', {attr: {'stroke-dashoffset': -44}, duration: .5, repeat: -1, ease: 'none'}));
    [kSp, wSp, tSp, bSp].forEach(function(arr){
      arr.forEach(function(c){
        ambient.push(gsap.to(c, {attr: {cx: '+=' + rnd(-6, 6), cy: '+=' + rnd(-10, 10)}, duration: rnd(2, 4), repeat: -1, yoyo: true, ease: 'sine.inOut'}));
      });
    });
    pSp.forEach(function(c){ ambient.push(gsap.to(c, {attr: {cx: '+=' + rnd(-5, 5), cy: '+=' + rnd(-3, 3)}, duration: rnd(1.5, 3), repeat: -1, yoyo: true, ease: 'sine.inOut'})); });
    ambient.push(gsap.to('#caustic', {x: 12, duration: 1.2, repeat: -1, yoyo: true, ease: 'sine.inOut'}));
    ambient.push(gsap.to('#flame', {scaleY: .9, transformOrigin: '50% 100%', duration: .25, repeat: -1, yoyo: true}));
  }

  // ---------- the film ----------
  var tl, endLoops = [];
  var tag = $('tag'), u = $('urdu');
  var words = u.textContent.trim().split(/\s+/); u.textContent = '';
  var spans = words.map(function(w, i){
    var s = document.createElement('span'); s.className = 'w' + (/^(پورے|گھر)$/.test(w) ? ' key' : ''); s.textContent = w;
    s.style.transitionDelay = (i * .22) + 's'; u.appendChild(s); if (i < words.length - 1) u.appendChild(document.createTextNode(' ')); return s;
  });
  document.querySelector('.english').style.transitionDelay = (words.length * .22 + .3) + 's';

  function show(tl, id, t){ tl.set('.sc', {autoAlpha: 0}, t); tl.set('#' + id, {autoAlpha: 1}, t); }
  var brow = {relax: 'M502 344 C510 339 522 338 534 341', worry: 'M502 348 C510 340 522 337 534 337', calm: 'M502 345 C510 340 522 339 534 342'};
  var mouth = {flat: 'M484 434 C488 435 492 434 496 433', smile: 'M483 433 C488 437 493 436 498 431'};

  function build(){
    if (tl) tl.kill(); endLoops.forEach(function(a){ a.kill(); }); endLoops = [];
    tag.classList.remove('on'); $('replay').classList.remove('on');
    tl = gsap.timeline();

    // 0: the kitchen, an ordinary afternoon
    show(tl, 'K', 0);
    tl.fromTo('#fade', {opacity: 1}, {opacity: 0, duration: 1}, 0);
    cam(tl, 'Kcam', [0, 0, 800], 0);
    cam(tl, 'Kcam', [30, 40, 740], 0, 1.8, 'power1.out');

    // 1.8: she fills a glass at the nal
    cam(tl, 'Kcam', [96, 400, 330], 1.8);
    tl.set('#Kglass', {opacity: 1, attr: {transform: 'translate(226 548)'}}, 1.8);
    tl.set('#KwaterD', {attr: {y: 120, height: 0}}, 1.8);
    tl.set('#KglassSpecks', {opacity: 0}, 1.8);
    tl.to('#nalKnob', {rotation: 80, transformOrigin: '50% 50%', duration: .5}, 2.0);
    tl.to('#Kstream', {attr: {height: 30}, duration: .25}, 2.3);
    tl.to('#KwaterD', {attr: {y: 22, height: 100}, duration: 1.4, ease: 'none'}, 2.4);
    tl.to('#KglassSpecks', {opacity: 1, duration: 1.2}, 2.6);
    tl.to('#Kstream', {attr: {height: 0}, duration: .2}, 3.8);

    // 4.0: over the karahi; the glass tilts, the light through it lands dull on the counter
    cam(tl, 'Kcam', [360, 330, 420], 4.0);
    tl.set('#Kglass', {attr: {transform: 'translate(586 366) rotate(-6)'}}, 4.0);
    tl.to('#Kglass', {attr: {transform: 'translate(590 370) rotate(-24)'}, duration: 1.5, ease: 'power2.out'}, 4.0);
    tl.to('#patch', {opacity: 1, duration: 1.2}, 4.2);
    // 5.5: her hand stops; the bangles settle a moment later; the steam goes on
    tl.to('#Kbangles', {rotation: 46, transformOrigin: '50% 50%', duration: .25, ease: 'power1.out'}, 5.5);
    tl.to('#Kbangles', {rotation: 40, duration: .5, ease: 'elastic.out(1, .4)'}, 5.75);
    cam(tl, 'Kcam', [380, 350, 380], 5.5, 1, 'power1.inOut');

    // 6.5: her face; her eyes drop, her brows draw in
    show(tl, 'W', 6.5);
    tl.set(['#Wglass', '#Whand', '#Wsill'], {opacity: 0}, 6.5);
    tl.set('#brow', {attr: {d: brow.relax}}, 6.5);
    tl.set('#mouth', {attr: {d: mouth.flat}}, 6.5);
    cam(tl, 'Wcam', [400, 240, 330], 6.5);
    cam(tl, 'Wcam', [410, 250, 300], 6.5, 1.5, 'power1.out');
    tl.to('#eye', {y: 2, duration: .6}, 6.8);
    tl.to('#brow', {attr: {d: brow.worry}, duration: .7, ease: 'power2.out'}, 6.9);

    // 8.0: she lifts the glass to the window
    cam(tl, 'Wcam', [100, 120, 600], 8.0);
    tl.to(['#Wglass', '#Whand'], {opacity: 1, duration: .35}, 8.0);
    tl.fromTo('#Wglass', {attr: {transform: 'translate(300 340) scale(1.6)'}}, {attr: {transform: 'translate(300 300) scale(1.6)'}, duration: 1.2, ease: 'power2.out'}, 8.0);
    tl.fromTo('#Whand', {y: 40}, {y: 0, duration: 1.2, ease: 'power2.out'}, 8.0);
    cam(tl, 'Wcam', [150, 170, 520], 8.2, 1.8, 'power1.inOut');

    // 10.0: she turns the flame down
    show(tl, 'K', 10.0);
    tl.set('#Kglass', {opacity: 0}, 10.0);
    cam(tl, 'Kcam', [620, 470, 200], 10.0);
    tl.to('#knob2', {rotation: -70, transformOrigin: '50% 50%', duration: .6}, 10.2);
    tl.to('#flame', {scale: .55, transformOrigin: '50% 100%', duration: .6}, 10.3);

    // 11.0: the glass on the sill; her fingers let go
    show(tl, 'W', 11.0);
    tl.set(['#Wglass', '#Whand'], {opacity: 0}, 11.0);
    tl.set('#Wsill', {opacity: 1}, 11.0);
    tl.set('#sillFingers', {x: 0, opacity: 1}, 11.0);
    cam(tl, 'Wcam', [130, 560, 440], 11.0);
    tl.to('#sillFingers', {x: 160, opacity: 0, duration: .8, ease: 'power1.in'}, 11.4);
    // 12.0: time passes; the grill shadow moves, the specks settle into a line
    tl.to('#sillShadow', {x: 70, duration: 1, ease: 'none'}, 12.0);
    tl.to(sSp, {attr: {cy: function(){ return rnd(108, 118); }}, duration: .9, ease: 'power2.in'}, 12.0);
    tl.to('#sillSettle', {opacity: .85, duration: .9}, 12.1);

    // 13.0: the test on her counter
    show(tl, 'T', 13.0);
    cam(tl, 'Tcam', [20, 225, 620], 13.0);
    tl.fromTo('#kitLid', {scaleY: 0, transformOrigin: '50% 100%'}, {scaleY: 1, duration: .6, ease: 'back.out(1.4)'}, 13.1);
    tl.fromTo('#Tglass', {attr: {transform: 'translate(470 460)'}, opacity: 0}, {attr: {transform: 'translate(470 520)'}, opacity: 1, duration: .7, ease: 'power2.out'}, 13.5);
    tl.fromTo('#Thand', {y: -60, opacity: 0}, {y: 0, opacity: 1, duration: .7, ease: 'power2.out'}, 13.5);
    tl.to('#Thand', {x: 120, y: 80, opacity: 0, duration: .7, ease: 'power1.in'}, 14.3);
    // 15.0: the meter probe in her glass
    tl.to('#meter', {opacity: 1, duration: .4}, 14.9);
    tl.fromTo('#probe', {y: -120, opacity: 0}, {y: 0, opacity: 1, duration: .7, ease: 'power2.out'}, 15.0);
    cam(tl, 'Tcam', [260, 260, 600], 15.0, 1, 'power1.inOut');
    // 16.0: the drop tubes, soft and already changed
    cam(tl, 'Tcam', [30, 330, 330], 16.0);
    tl.set('#dropper', {opacity: 1}, 16.0);
    tl.fromTo('#drop', {attr: {cy: 12}, opacity: 1}, {attr: {cy: 70}, opacity: 0, duration: .6, ease: 'power1.in'}, 16.3);
    // 17.5: the family at the counter
    cam(tl, 'Tcam', [0, 200, 800], 17.5);
    tl.set('#dropper', {opacity: 0}, 17.5);
    tl.to('#daughter', {opacity: 1, attr: {transform: 'translate(0 0)'}, duration: .6, ease: 'power2.out'}, 17.5);
    tl.to('#husbandHand', {opacity: 1, duration: .5}, 17.6);
    // 18.5: the card, 8 rows filled
    cam(tl, 'Tcam', [190, 560, 420], 18.5);
    tl.set('#card', {opacity: 1}, 18.5);
    tl.to('#pen', {opacity: 1, duration: .2}, 18.5);
    tl.to('#rowMarks .mark', {attr: {'stroke-dashoffset': 0}, duration: .18, stagger: .17, ease: 'none'}, 18.6);
    tl.to('#pen', {y: 160, duration: 1.4, ease: 'none'}, 18.6);
    // 20.0: the card in her hands
    tl.to('#pen', {opacity: 0, duration: .2}, 20.0);
    cam(tl, 'Tcam', [110, 560, 580], 20.0, .8, 'power1.inOut');
    tl.to('#herHands', {opacity: 1, duration: .4}, 20.1);
    tl.to('#card', {y: -20, duration: .8, ease: 'power1.out'}, 20.2);
    // 21.0: she decides; a small nod
    show(tl, 'W', 21.0);
    tl.set(['#Wglass', '#Whand', '#Wsill'], {opacity: 0}, 21.0);
    tl.set('#brow', {attr: {d: brow.calm}}, 21.0);
    tl.set('#eye', {y: 0}, 21.0);
    cam(tl, 'Wcam', [400, 240, 330], 21.0);
    tl.to('#her', {rotation: 4, transformOrigin: '560px 640px', duration: .35, ease: 'power1.inOut', yoyo: true, repeat: 1}, 21.2);

    // 22.0: the main line; the filter is fitted onto the line by hand
    show(tl, 'M', 22.0);
    tl.set(['#bowlWater', '#haze', '#shadows', '#Mhand'], {opacity: 0}, 22.0);
    cam(tl, 'Mcam', [60, 200, 640], 22.0);
    tl.fromTo('#housing', {attr: {transform: 'translate(400 -150)'}}, {attr: {transform: 'translate(400 330)'}, duration: .9, ease: 'bounce.out'}, 22.0);
    cam(tl, 'Mcam', [200, 280, 420], 23.0, .6);
    tl.to('#Mhand', {opacity: 1, duration: .3}, 23.1);
    tl.fromTo('#bowlShine', {x: 0}, {x: 70, duration: .35, yoyo: true, repeat: 3, ease: 'sine.inOut'}, 23.3);
    tl.to('#Mhand', {x: 80, opacity: 0, duration: .4}, 24.2);
    // 24.5: the water comes in; the first rust gathers on the cartridge
    cam(tl, 'Mcam', [230, 300, 340], 24.5);
    tl.to('#bowlWater', {opacity: 1, duration: .6}, 24.6);
    tl.to('#haze', {opacity: .2, duration: 1.4}, 24.9);
    // 26.0: the tap downstream runs clear
    show(tl, 'Y', 26.0);
    tl.set('#Ystream', {opacity: 1}, 26.0);
    tl.set('#Ydrip', {opacity: 0}, 26.0);
    cam(tl, 'Ycam', [190, 470, 300], 26.0);
    cam(tl, 'Ycam', [130, 400, 420], 26.0, 2.8);

    // 29.0: 2 to 3 months later; the cartridge opened in front of them
    tl.to('#fade', {opacity: 1, duration: .4}, 28.8);
    show(tl, 'C', 29.2);
    tl.to('#fade', {opacity: 0, duration: .6}, 29.2);
    cam(tl, 'Ccam', [0, 0, 800], 29.2);
    cam(tl, 'Ccam', [60, 140, 680], 29.2, 2.8, 'power1.inOut');
    tl.fromTo('#leaves path', {y: -30, opacity: 0}, {y: 0, opacity: 1, duration: 1.4, stagger: .02, ease: 'power1.out'}, 29.2);
    tl.fromTo('#rustTex', {y: -6}, {y: 6, duration: 1.1, ease: 'power1.inOut'}, 30.6);
    tl.to('#Chands', {y: 12, duration: .5, yoyo: true, repeat: 1}, 30.6);
    tl.fromTo('#CherHand', {x: -60, opacity: 0}, {x: 0, opacity: 1, duration: .8, ease: 'power2.out'}, 31.8);
    tl.to('#CherHand', {y: 150, duration: .9, ease: 'sine.inOut'}, 32.8);
    tl.fromTo('#ChusHand', {x: 60, opacity: 0}, {x: 0, opacity: 1, duration: .8, ease: 'power2.out'}, 33.0);
    cam(tl, 'Ccam', [0, 60, 800], 33.4, 1.2);
    tl.fromTo('#CkidHand', {x: -10}, {x: 6, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: 1}, 33.6);

    // 35.0: at the wash basin; cupped hands fill with crystal clear water and lift to the face
    show(tl, 'B', 35.0);
    tl.set('#Bpool', {opacity: 0}, 35.0);
    tl.set('#Bhands', {y: 0}, 35.0);
    tl.set('#Bdrops', {opacity: 0, y: 0}, 35.0);
    cam(tl, 'Bcam', [100, 300, 600], 35.0);
    tl.to('#Bpool', {opacity: .95, duration: .8}, 35.1);
    tl.to('#Bhands', {y: -260, duration: .9, ease: 'power2.in'}, 36.1);
    tl.fromTo('#Bspill', {attr: {cy: 736}, opacity: 1}, {attr: {cy: 900}, opacity: 0, duration: .5, repeat: 2, ease: 'power1.in'}, 35.3);
    tl.to('#Bdrops', {opacity: 1, duration: .2}, 36.5);
    tl.to('#Bdrops', {y: 160, opacity: 0, duration: .7, ease: 'power1.in'}, 36.6);

    // 37.0: the same glass fills, clear
    show(tl, 'K', 37.0);
    tl.set('#patch', {opacity: 0}, 37.0);
    tl.set('#flame', {scale: 1}, 37.0);
    tl.set('#knob2', {rotation: 0}, 37.0);
    cam(tl, 'Kcam', [96, 400, 330], 37.0);
    tl.set('#Kglass', {opacity: 1, attr: {transform: 'translate(226 548)'}}, 37.0);
    tl.set('#KwaterD', {opacity: 0}, 37.0);
    tl.set('#KglassSpecks', {opacity: 0}, 37.0);
    tl.set('#KwaterC', {opacity: 1, attr: {y: 120, height: 0}}, 37.0);
    tl.set('#Kstream', {attr: {fill: '#8ED2F5', height: 30}, opacity: .95}, 37.0);
    tl.to('#KwaterC', {attr: {y: 22, height: 100}, duration: .9, ease: 'none'}, 37.05);
    tl.to('#Kstream', {attr: {height: 0}, duration: .15}, 37.9);

    // 38.0: to the window again; now the grill shows sharp through it
    show(tl, 'W', 38.0);
    tl.set('#Wsill', {opacity: 0}, 38.0);
    tl.set(['#Wglass', '#Whand'], {opacity: 1}, 38.0);
    tl.set('#WwaterD', {opacity: 0}, 38.0);
    tl.set('#WglassSpecks', {opacity: 0}, 38.0);
    tl.set('#WwaterC', {opacity: 1}, 38.0);
    tl.set('#WthroughSharp', {opacity: 1}, 38.0);
    tl.set('#WthroughBlur', {opacity: 0}, 38.0);
    tl.set('#Wshine', {opacity: .9}, 38.0);
    tl.set('#brow', {attr: {d: brow.calm}}, 38.0);
    cam(tl, 'Wcam', [150, 170, 520], 38.0);
    cam(tl, 'Wcam', [170, 190, 480], 38.0, 1);
    // 39.0: over the karahi; the patch on the counter is bright
    show(tl, 'K', 39.0);
    cam(tl, 'Kcam', [380, 350, 380], 39.0);
    tl.set('#Kglass', {attr: {transform: 'translate(590 370) rotate(-24)'}}, 39.0);
    tl.to('#patchBright', {opacity: 1, duration: .6}, 39.1);
    // 40.0: her small smile, to herself
    show(tl, 'W', 40.0);
    tl.set(['#Wglass', '#Whand'], {opacity: 0}, 40.0);
    cam(tl, 'Wcam', [410, 250, 300], 40.0);
    tl.to('#mouth', {attr: {d: mouth.smile}, duration: .6}, 40.2);
    tl.to('#brow', {attr: {d: brow.relax}, duration: .6}, 40.2);
    // 41.0: she pours; the masala sizzles
    show(tl, 'K', 41.0);
    cam(tl, 'Kcam', [400, 290, 400], 41.0);
    tl.to('#Kglass', {attr: {transform: 'translate(632 452) rotate(-118)'}, duration: .5, ease: 'power2.out'}, 41.0);
    tl.to(['#Kpour', '#Kpour2'], {opacity: .95, duration: .15}, 41.4);
    tl.fromTo('#splashK', {opacity: 0, y: 0}, {opacity: 1, y: -10, duration: .3, repeat: 3, yoyo: true}, 41.5);
    tl.to('#steamK', {opacity: .9, duration: .3}, 41.3);
    tl.to(['#Kpour', '#Kpour2'], {opacity: 0, duration: .25}, 42.25);

    // 42.0: the family in the kitchen; the wazu tap through the door
    tl.to('#fade', {opacity: 1, duration: .3}, 42.3);
    show(tl, 'F', 42.6);
    tl.to('#fade', {opacity: 0, duration: .6}, 42.6);
    tl.set('#Fstream', {opacity: 1}, 42.6);
    cam(tl, 'Fcam', [160, 300, 480], 42.6);
    cam(tl, 'Fcam', [60, 100, 720], 42.8, 3.0, 'power2.inOut');
    tl.to('#Fstream', {opacity: 0, duration: .8}, 45.2);
    // 46.0: the tagline
    tl.call(function(){
      tag.classList.add('on');
      ambient.forEach(function(a){ a.kill(); }); ambient = [];
      gsap.utils.toArray('#steamF .stm').forEach(function(p, i){ endLoops.push(gsap.fromTo(p, {y: 0, opacity: .7}, {y: -60, opacity: 0, duration: 3.2, repeat: -1, ease: 'none', delay: i * .8})); });
      endLoops.push(gsap.fromTo('#Fdrip', {attr: {cy: 350}, opacity: 1}, {attr: {cy: 374}, opacity: .6, duration: .45, repeat: -1, repeatDelay: 1.1, ease: 'power2.in'}));
      endLoops.push(gsap.fromTo('#Fsplash', {attr: {rx: 4, ry: 1.5}, opacity: 0}, {keyframes: [{attr: {rx: 6, ry: 2}, opacity: .9, duration: .05}, {attr: {rx: 22, ry: 5}, opacity: 0, duration: .9}], repeat: -1, repeatDelay: .6, delay: .45}));
      endLoops.push(gsap.to('#toy', {x: 6, rotation: 6, transformOrigin: '50% 50%', duration: 1.4, repeat: -1, yoyo: true, ease: 'sine.inOut'}));
      endLoops.push(gsap.to('#Fspoon', {rotation: 12, transformOrigin: '50% 100%', duration: 1.1, repeat: -1, yoyo: true, ease: 'sine.inOut'}));
      endLoops.push(gsap.to('#Fdaughter', {y: -3, duration: 1.6, repeat: -1, yoyo: true, ease: 'sine.inOut'}));
      $('replay').classList.add('on');
    }, null, 46.0);
  }

  function start(){ always(); build(); }
  $('replay').addEventListener('click', function(){
    endLoops.forEach(function(x){ x.kill(); }); endLoops = [];
    tag.classList.remove('on'); $('replay').classList.remove('on');
    always(); tl.restart();
  });
  start();
})();

</script>
</body>
</html>
